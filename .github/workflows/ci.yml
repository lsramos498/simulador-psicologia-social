# Render despliega lumina-api y lumina-web cuando todos estos jobs pasan.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  MYSQL_IMAGE: mysql:8.4.13

jobs:
  backend:
    name: Backend (pruebas unitarias)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-fund
      - name: Pruebas
        run: npm test
      - name: Auditoría de dependencias de producción (falla con severidad alta)
        run: npm audit --omit=dev --audit-level=high

  backend-mysql:
    name: Backend (integración con MySQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-fund
      # docker run en lugar de services: MySQL necesita argumentos de arranque.
      - name: Levantar MySQL de pruebas
        run: |
          docker run -d --name mysql-ci -p 127.0.0.1:3307:3306 \
            -e MYSQL_ROOT_PASSWORD=root-ci -e TZ=America/Bogota "$MYSQL_IMAGE" \
            --default-time-zone=-05:00 --log-bin-trust-function-creators=1 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for _ in $(seq 1 60); do
            if docker exec mysql-ci mysqladmin ping -h127.0.0.1 -uroot -proot-ci --silent 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs mysql-ci
          exit 1
      - name: Crear la base de pruebas y su usuario
        run: |
          docker exec -i -e MYSQL_PWD=root-ci mysql-ci mysql -uroot --default-character-set=utf8mb4 < database/schema.test.sql
          docker exec -e MYSQL_PWD=root-ci mysql-ci mysql -uroot -e \
            "CREATE USER 'lumina_test'@'%' IDENTIFIED BY 'ci-lumina-test'; GRANT SELECT, INSERT, UPDATE, DELETE ON proyecto_nuclear_test.* TO 'lumina_test'@'%';"
      - name: Configuración de pruebas (.env y .env.test efímeros)
        run: |
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3307"
            echo "DB_NAME=proyecto_nuclear_test"
            echo "DB_USER=lumina_test"
            echo "DB_PASSWORD=ci-lumina-test"
            echo "DB_TIMEZONE=-05:00"
            echo "CODIGO_AUTORIZACION_SECRETO=$(openssl rand -hex 32)"
            echo "JWT_SECRETO=$(openssl rand -hex 32)"
          } > .env
          cp .env .env.test
      - name: Pruebas con MySQL real
        env:
          LUMINA_MYSQL_TEST: "1"
        run: npm run test:mysql

  base-de-datos:
    name: Imagen de MySQL de producción (esquema + disparadores)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen que usa Render
        run: docker build -f deploy/mysql/Dockerfile -t lumina-mysql:ci .
      - name: Inicializar y verificar
        run: |
          docker run -d --name mysql-prod -e MYSQL_ROOT_PASSWORD=root-ci -e LUMINA_APP_PASSWORD=app-ci lumina-mysql:ci
          for _ in $(seq 1 90); do
            if docker logs mysql-prod 2>&1 | grep -q "Usuario lumina_app creado" \
              && docker exec mysql-prod mysqladmin ping -h127.0.0.1 -uroot -proot-ci --silent 2>/dev/null; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' mysql-prod)" != "true" ]; then
              docker logs mysql-prod; exit 1
            fi
            sleep 2
          done
          consulta() { docker exec -e MYSQL_PWD=root-ci mysql-prod mysql -uroot -N -e "$1"; }
          tablas=$(consulta "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='proyecto_nuclear' AND table_type='BASE TABLE'")
          disparadores=$(consulta "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='proyecto_nuclear'")
          zona=$(consulta "SELECT @@global.time_zone")
          echo "tablas=$tablas disparadores=$disparadores zona=$zona"
          {
            echo "### Imagen de MySQL"
            echo "- Tablas: $tablas"
            echo "- Disparadores: $disparadores"
            echo "- Zona horaria: $zona"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$tablas" -ge 27
          test "$disparadores" -ge 1
          test "$zona" = "-05:00"
          if docker exec -e MYSQL_PWD=app-ci mysql-prod mysql -ulumina_app -e "CREATE TABLE proyecto_nuclear.prueba_ci (a INT)" 2>/dev/null; then
            echo "lumina_app no debería poder crear tablas"; exit 1
          fi

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # zod (vía jimp) tiene un aviso alto, pero jimp no entra al bundle publicado.
      - name: Auditoría de dependencias de producción
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

  secretos:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Solo commits posteriores a la línea base; el historial anterior ya se revisó.
      - name: gitleaks (commits nuevos)
        env:
          LINEA_BASE: 06c294ccfc2f7c3735f4d67620229640fb5dbcfe
        run: |
          docker run --rm -v "$PWD":/repo:ro zricethezav/gitleaks:v8.30.1 git /repo \
            --no-banner --redact --verbose --log-opts="${LINEA_BASE}..HEAD"

  flujos:
    name: Validación de los workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
