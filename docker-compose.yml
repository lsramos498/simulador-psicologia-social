services:
  mysql:
    image: mysql:8.0
    container_name: lumina-mysql
    ports:
      - "3306:3306"
    environment:
      TZ: America/Bogota
      MYSQL_ROOT_PASSWORD: rootlocal
      MYSQL_DATABASE: proyecto_nuclear
      MYSQL_USER: lumina_app
      MYSQL_PASSWORD: Lumina2026
    command:
      - --default-time-zone=-05:00
      - --log-bin-trust-function-creators=1
    volumes:
      - lumina-mysql-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql:ro
      - ./backend/database/vistas_y_disparadores_clase.sql:/docker-entrypoint-initdb.d/03-vistas-disparadores-clase.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootlocal"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql-test:
    image: mysql:8.0
    container_name: lumina-mysql-test
    ports:
      - "3307:3306"
    environment:
      TZ: America/Bogota
      MYSQL_ROOT_PASSWORD: rootlocal
      MYSQL_DATABASE: proyecto_nuclear_test
      MYSQL_USER: lumina_test
      MYSQL_PASSWORD: LuminaTest2026
    command:
      - --default-time-zone=-05:00
      - --log-bin-trust-function-creators=1
    volumes:
      - lumina-mysql-test-data:/var/lib/mysql
      - ./backend/database/schema.test.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootlocal"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  lumina-mysql-data:
  lumina-mysql-test-data:
